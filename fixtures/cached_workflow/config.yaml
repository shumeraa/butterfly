# Run from the repository root, with --dummy_execution.
output_dir: ./output/cached_workflow_dummy
do_unit_test: true
do_train: false
run_fixed_code: false

data:
  dataset_name: GQA
  dataset_args:
    annotation_file: ./fixtures/cached_workflow/annotations.json
    image_root: ./fixtures/cached_workflow
    num_samples: -1
    sample_per_type: -1

visual_program_generator:
  model_name: dummy

unit_test_generation:
  use_program: false

unit_test_suite:
  mode: metamorphic
  metamorphic_count: 100
  metamorphic:
    tests_path: ./fixtures/cached_workflow/custom_tests.json

execution:
  metamorphic_baselines: true
  feedback_max_iters: 1
  synonym_checker: false
  image_agg: mean
  code_agg: vote
  use_fixed_code_when_low_confidence: false
